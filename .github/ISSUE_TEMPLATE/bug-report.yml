name: Bug report
description: Potatify crashed, did not install, or an option misbehaves.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: "1. potatify.exe, preset PS1, Log on, Install into ...\n2. Start the game\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Potatify version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Game, GPU, Windows version
      placeholder: "Some Game (Steam), RX 570, Windows 11 24H2"
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste or attach potatify-d3d11.log / potatify-d3d12.log from the game folder.
      render: text
